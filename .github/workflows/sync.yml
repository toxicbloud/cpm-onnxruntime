name: Sync ONNX Runtime Releases

on:
  schedule:
    - cron: '0 0 * * *' # Check daily at midnight.
  workflow_dispatch: # Allow manual runs.

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync All Missing Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. List up to 200 releases as JSON, excluding pre-releases and drafts.
          RELEASES=$(gh release list -R microsoft/onnxruntime --exclude-pre-releases --exclude-drafts --limit 200 --json tagName -q ".[].tagName" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

          # 2. Reverse the list to process releases from oldest to newest.
          RELEASES=$(echo "$RELEASES" | tac)

          # 3. Process each version.
          for TAG in $RELEASES; do
            VERSION=${TAG#v}

            # Check whether the tag already exists on origin.
            if git ls-remote --tags origin refs/tags/$TAG | grep -q "$TAG"; then
              echo "Tag $TAG already exists; skipping."
            else
              echo "Creating tag $TAG (version $VERSION)..."

              # Switch to main and pull the latest changes.
              git checkout main
              git pull origin main

              # Update the version in CMakeLists.txt.
              sed -i -E "s/set\(ORT_VERSION \".*\"\)/set\(ORT_VERSION \"$VERSION\"\)/" CMakeLists.txt

              # Commit the change to main.
              git add CMakeLists.txt
              git commit -m "Auto-update to ONNX Runtime $VERSION"
              git push origin main

              # Create and push the tag.
              git tag $TAG
              git push origin $TAG

              # Create the GitHub release with the official CLI.
              gh release create $TAG --title "Release $TAG" --notes "Automated mirror release for ONNX Runtime $TAG"
              
              # Pause briefly to avoid sending too many requests to the GitHub API.
              sleep 2
            fi
          done